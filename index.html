<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Manual das Patologias do Concreto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Manual digital para pessoas comuns: entenda fissuras, eflorescência, ferrugem, concreto soltando e outros sinais em estruturas de concreto armado, e saiba qual é o próximo passo.">
<meta property="og:title" content="Manual das Patologias do Concreto">
<meta property="og:description" content="Reconheça sinais de problemas no concreto, entenda o que podem significar e saiba quem procurar.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho colante + índice lateral de capítulos + página de leitura em coluna única.
   Linguagem visual: prancha técnica (legendas em mono "FIG. 2.1", hachura de concreto), laranja de segurança só para ação e destaque. */
:root{
  --bg:#f1f1ee; --surface:#ffffff; --surface2:#e8e8e4;
  --ink:#1d2125; --ink2:#444b52; --ink3:#666d74;
  --line:#d4d5d0; --conc:#c9cbc6; --hatch:#a3a6a0;
  --accent:#e8590c; --accent-ink:#a83a00; --on-accent:#17120e;
  --l1:#1f6b4a; --l1bg:#e1f0e8; --l2:#7d5200; --l2bg:#faedcc; --l3:#a3201a; --l3bg:#fbe3e0;
  --info:#27567f; --infobg:#e3edf6;
  --wet:#6aa6d6; --rustc:#b5551f; --white:#f7f7f4;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --hh:60px; --navw:288px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141618; --surface:#1d2023; --surface2:#272b2f;
    --ink:#ecece9; --ink2:#bbbfc3; --ink3:#90969b; --line:#363a3e; --conc:#3a3e42; --hatch:#575c61;
    --accent:#ff7a2e; --accent-ink:#ff9a57; --on-accent:#17120e;
    --l1:#74d3a3; --l1bg:#14301f; --l2:#f2bd5c; --l2bg:#3a2e10; --l3:#ff9086; --l3bg:#3d1b19;
    --info:#8fbfe9; --infobg:#1a2a39;
    --wet:#4a85b5; --rustc:#d77a3d; --white:#d8d8d3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141618; --surface:#1d2023; --surface2:#272b2f;
  --ink:#ecece9; --ink2:#bbbfc3; --ink3:#90969b; --line:#363a3e; --conc:#3a3e42; --hatch:#575c61;
  --accent:#ff7a2e; --accent-ink:#ff9a57; --on-accent:#17120e;
  --l1:#74d3a3; --l1bg:#14301f; --l2:#f2bd5c; --l2bg:#3a2e10; --l3:#ff9086; --l3bg:#3d1b19;
  --info:#8fbfe9; --infobg:#1a2a39;
  --wet:#4a85b5; --rustc:#d77a3d; --white:#d8d8d3; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font:400 16.5px/1.65 var(--f-body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
a{color:var(--info);text-underline-offset:3px}
a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--ink);color:var(--bg);padding:8px 14px;border:0;border-radius:4px;font:inherit}
.skip:focus{left:8px}
.mono{font-family:var(--f-mono);font-size:.78em;letter-spacing:.04em}
button{font:inherit;color:inherit}

/* Cabeçalho */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{height:var(--hh);display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--accent);transition:width .1s linear}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.05;font-family:var(--f-head)}
.brand-1{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.brand-2{font-size:1.12rem;font-weight:700;white-space:nowrap}
.hdr-search{margin-left:auto;display:flex;align-items:center;gap:8px;width:min(380px,36vw);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 10px;color:var(--ink3)}
.hdr-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.92rem;padding:9px 0;outline:0}
.hdr-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--surface2)}
.menu-btn,.search-link{display:none}

/* Estrutura */
.layout{display:grid;grid-template-columns:var(--navw) minmax(0,1fr);align-items:start}
.nav{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--hh));overflow:auto;padding:22px 14px 40px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);font-size:.92rem}
.nav h2{font:600 .7rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:22px 8px 8px}
.nav h2:first-child{margin-top:0}
.nav ul{list-style:none;margin:0;padding:0}
.nav a{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:5px;text-decoration:none;color:var(--ink2);line-height:1.3}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:500}
.nav .n{font:500 .74rem var(--f-mono);min-width:1.6em;color:var(--ink3)}
.nav a[aria-current="page"] .n{color:var(--accent)}
.scrim{display:none}
main{min-width:0}
main:focus,main:focus-visible{outline:none}
.page{max-width:820px;margin:0 auto;padding:34px max(16px,env(safe-area-inset-right,0px)) 80px max(24px,env(safe-area-inset-left,0px))}
.page.wide{max-width:1120px}
@media (min-width:901px){.page{padding-left:36px;padding-right:36px}}

/* Tipografia */
.eyebrow{font:500 .78rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:10px;margin:0 0 10px}
.eyebrow::before{content:"";width:18px;height:3px;background:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:700;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);letter-spacing:-.01em}
h2{font-size:clamp(1.45rem,3vw,1.9rem);margin:0 0 14px}
h3{font-size:1.2rem;margin:0 0 8px}
.lead{font-size:1.2rem;line-height:1.55;color:var(--ink2);max-width:60ch;margin:16px 0 0}
p{margin:0 0 1em;max-width:68ch}
.list{margin:0 0 1.1em;padding-left:1.25em;max-width:68ch}
.list li{margin:.32em 0}
.list li::marker{color:var(--accent-ink)}
.sec{margin-top:52px}
.sec>h2{padding-top:14px;border-top:2px solid var(--ink)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
.linklike{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;color:var(--ink2)}
.linklike:hover{border-color:var(--ink);color:var(--ink)}

/* Botões e chips */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:6px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:8px 14px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;cursor:pointer;color:var(--ink2);text-decoration:none}
.chip:hover,.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.lvl{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:4px;white-space:nowrap}
.lvl b{font-family:var(--f-mono);font-weight:500;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.lvl.l1{background:var(--l1bg);color:var(--l1)}
.lvl.l2{background:var(--l2bg);color:var(--l2)}
.lvl.l3{background:var(--l3bg);color:var(--l3)}

/* Avisos */
.call{margin:1.4em 0;padding:16px 18px;border-radius:6px;border:1px solid var(--line);background:var(--surface);max-width:68ch}
.call p:last-child,.call .list:last-child{margin-bottom:0}
.call-h{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-family:var(--f-head);font-size:1.08rem}
.call-h svg{flex:none}
.call.info{background:var(--infobg);border-color:transparent}.call.info .call-h{color:var(--info)}
.call.warn{background:var(--l2bg);border-color:transparent}.call.warn .call-h{color:var(--l2)}
.call.danger{background:var(--l3bg);border-color:transparent}.call.danger .call-h{color:var(--l3)}
.call.ok{background:var(--l1bg);border-color:transparent}.call.ok .call-h{color:var(--l1)}
.call.tip{background:var(--surface);border-left:4px solid var(--accent)}

/* Figuras e diagramas */
.fig{margin:1.6em 0;max-width:640px}
.fig-art{border:1.5px solid var(--ink);background:var(--surface)}
.fig figcaption{font-size:.88rem;color:var(--ink2);padding-top:8px;line-height:1.45}
.fig figcaption .mono{color:var(--ink);font-weight:500;margin-right:6px}
.dg{display:block;width:100%;height:auto}
.dg-bg{fill:var(--surface)}
.conc{fill:var(--conc);stroke:var(--ink3);stroke-width:1.2}
.hatch{fill:url(#hatch);stroke:none}
.crack{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.crack.thin{stroke-width:1.2}
.steel{fill:var(--ink3);stroke:var(--ink);stroke-width:1.2}
.rust{fill:var(--rustc);stroke:var(--ink);stroke-width:1}
.rust-l{stroke:var(--rustc);stroke-width:4;fill:none;stroke-linecap:round}
.rust-fill{fill:var(--rustc);opacity:.55}
.wetf{fill:var(--wet)}
.wetf.soft{opacity:.5}
.whitef{fill:var(--white);stroke:var(--ink3);stroke-width:.6}
.lbl{font:500 9px var(--f-mono);fill:var(--ink2)}
.lbl.b{fill:var(--ink);font-weight:500}
.arrow{stroke:var(--accent-ink);stroke-width:1.8;fill:none}
.dim{stroke:var(--ink2);stroke-width:1;fill:none;stroke-dasharray:4 3}
.void{fill:var(--ink)}
.agg{fill:var(--surface2);stroke:var(--ink3);stroke-width:.8}
.brick{fill:var(--surface2);stroke:var(--ink3);stroke-width:1.2}
.patch{fill:var(--surface);stroke:var(--accent-ink);stroke-width:1.4;stroke-dasharray:4 3}
.gap{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.beam{fill:none;stroke:var(--ink);stroke-width:12;stroke-linecap:butt}

/* Cards e grades */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin:22px 0}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:var(--ink);text-decoration:none}
a.card:hover{border-color:var(--ink)}
.card-art{border-bottom:1px solid var(--line);background:var(--surface)}
.card-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-b h3{font-size:1.14rem;margin:0}
.card-b p{font-size:.93rem;color:var(--ink2);margin:0}
.card-go{margin-top:auto;padding-top:8px;font-weight:600;font-size:.92rem;color:var(--accent-ink)}
.card:hover .card-go{text-decoration:underline}

/* Início */
.hero{padding:6px 0 0}
.hero h1{font-size:clamp(2.3rem,6.4vw,4rem);max-width:15ch}
.hero .lead{font-size:1.28rem}
.bigsearch{display:flex;gap:8px;margin:28px 0 12px;max-width:640px}
.bigsearch input{flex:1;min-width:0;padding:14px 16px;font:inherit;border:2px solid var(--ink);border-radius:6px;background:var(--surface);color:var(--ink)}
.bigsearch input:focus{outline:3px solid var(--accent);outline-offset:1px}
.try{font-size:.88rem;color:var(--ink3);margin:0 0 6px}
.disc{display:flex;gap:12px;align-items:flex-start;margin:30px 0 0;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:.93rem;color:var(--ink2);max-width:68ch}
.disc svg{flex:none;margin-top:2px}
.flow{list-style:none;margin:22px 0;padding:0;display:grid;gap:0;counter-reset:f;grid-template-columns:repeat(5,minmax(0,1fr));border:1.5px solid var(--ink);background:var(--surface)}
.flow li{counter-increment:f;padding:16px 14px;border-right:1px solid var(--line);font-size:.92rem;line-height:1.4}
.flow li:last-child{border-right:0}
.flow li::before{content:counter(f);display:block;font:500 1.6rem var(--f-mono);color:var(--accent-ink);margin-bottom:6px}
.flow li b{display:block;font-family:var(--f-head);font-size:1.05rem;margin-bottom:3px}
@media (max-width:760px){.flow{grid-template-columns:1fr}.flow li{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:40px 1fr;column-gap:8px}.flow li::before{grid-row:span 2;margin:0}.flow li:last-child{border-bottom:0}}
.shortcuts{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.shortcuts .card-b h3{font-size:1.04rem}
.three{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr));margin:22px 0}
.lcard{padding:16px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.lcard h3{font-size:1.05rem;margin:8px 0 6px}
.lcard p{font-size:.92rem;color:var(--ink2);margin:0}
.lcard.l1{border-top:5px solid var(--l1)}.lcard.l2{border-top:5px solid var(--l2)}.lcard.l3{border-top:5px solid var(--l3)}
.lcard ul{margin:8px 0 0;padding-left:1.1em;font-size:.92rem;color:var(--ink2)}
@media (max-width:760px){.three{grid-template-columns:1fr}}

/* Quadros de comparação */
.tablewrap{overflow-x:auto;margin:1.4em 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.cmp{border-collapse:collapse;width:100%;min-width:560px;font-size:.93rem}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line)}
.cmp th{font-family:var(--f-head);font-size:.98rem;background:var(--surface2)}
.cmp tr:last-child td{border-bottom:0}
.cmp td:first-child{font-weight:600}
.four{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin:20px 0}
.four>div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.four h3{font-size:1rem;display:flex;align-items:center;gap:8px}
.four h3 .mono{color:var(--accent-ink)}
.four p{font-size:.92rem;color:var(--ink2);margin:0}
@media (max-width:640px){.four{grid-template-columns:1fr}}

/* Fichas de fissuras (acordeão) */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:10px 0;max-width:820px}
.acc[open]{border-color:var(--ink)}
.acc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:104px 1fr auto;gap:14px;align-items:center;padding:10px 14px 10px 10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .thumb{border:1px solid var(--line);background:var(--surface)}
.acc summary h3{margin:0;font-size:1.1rem}
.acc summary .chips{margin-top:6px;gap:6px}
.acc summary::after{content:"+";font:500 1.5rem var(--f-mono);color:var(--accent-ink);padding:0 6px}
.acc[open] summary::after{content:"–"}
.acc-b{padding:6px 18px 18px;border-top:1px solid var(--line)}
.acc-b dl{margin:0;display:grid;gap:14px}
.acc-b dt{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.acc-b dd{margin:0}
.acc-b dd p,.acc-b dd ul{margin:0;max-width:none}
.acc-b dd ul{padding-left:1.2em}
.acc-b dl>div{padding-top:12px}
@media (max-width:560px){.acc summary{grid-template-columns:72px 1fr auto}}

/* Níveis */
.levels{display:grid;gap:14px;margin:22px 0}
.level{display:grid;grid-template-columns:96px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.level .side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.level .side strong{font:600 2.4rem var(--f-head);letter-spacing:0}
.level.l1 .side{background:var(--l1bg);color:var(--l1)}
.level.l2 .side{background:var(--l2bg);color:var(--l2)}
.level.l3 .side{background:var(--l3bg);color:var(--l3)}
.level .body{padding:16px 18px;min-width:0}
.level h3{margin-bottom:4px}
.level h4{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:12px 0 4px}
.level .list{margin:0;font-size:.95rem}
@media (max-width:560px){.level{grid-template-columns:1fr}.level .side{flex-direction:row;justify-content:flex-start;gap:12px}}

/* Posso consertar? */
.diy{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));margin:22px 0}
.diy>div{border-radius:6px;padding:18px;border:1px solid var(--line);background:var(--surface)}
.diy .yes{border-top:5px solid var(--l1)}.diy .no{border-top:5px solid var(--l3)}
.diy h3{font-size:1.15rem}
.diy .list{font-size:.95rem;margin-bottom:0}
@media (max-width:760px){.diy{grid-template-columns:1fr}}
.who{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));margin:22px 0}
.who>div{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.who h3{font-size:1.1rem}
.who p{font-size:.93rem;color:var(--ink2);margin:0}
.who .emerg{background:var(--l3bg);border-color:transparent}
.who .emerg h3{color:var(--l3)}
.phone{font:600 1.4rem var(--f-mono);color:var(--ink)}
@media (max-width:640px){.who{grid-template-columns:1fr}}

/* Vídeo */
.vslot{display:flex;gap:12px;align-items:center;margin:24px 0 0;padding:10px 14px;border:1px dashed var(--line);border-radius:6px;font-size:.9rem;color:var(--ink3);max-width:68ch}
.vslot svg{flex:none}
.vthumb{position:relative;aspect-ratio:16/9;background:var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .play{position:absolute;width:54px;height:54px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.vthumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font:500 .74rem var(--f-mono);padding:2px 6px;border-radius:3px}
.vthumb.ph{background:var(--surface2)}
.vbox{margin:26px 0;max-width:720px}
.vbox .card{width:100%;text-align:left;cursor:pointer;font:inherit}
.vbox h2{font-size:1.1rem;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--ink3);margin-bottom:10px}
.vmodal{position:fixed;inset:0;z-index:200;background:rgba(10,12,14,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vmodal-in{width:min(960px,100%);background:var(--surface);border-radius:8px;overflow:hidden;max-height:100%;display:flex;flex-direction:column}
.vmodal-player{aspect-ratio:16/9;background:#000}
.vmodal-player video,.vmodal-player iframe{width:100%;height:100%;border:0;display:block}
.vmodal-meta{padding:14px 18px;overflow:auto}
.vmodal-meta h3{margin-bottom:4px}
.vmodal-meta p{margin:0 0 .6em;font-size:.95rem;color:var(--ink2)}
.vmodal-x{display:flex;justify-content:flex-end;padding:6px 8px 0}
.empty{padding:28px;border:1.5px dashed var(--line);border-radius:8px;background:var(--surface);max-width:680px}
.empty h3{font-size:1.25rem}
.empty p{color:var(--ink2)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 4px}
.filters input{flex:1 1 220px;min-width:0;padding:10px 14px;border:1.5px solid var(--ink);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}

/* Ferramenta de identificação */
.tool{margin-top:26px}
.stephead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font:500 .8rem var(--f-mono);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;background:var(--accent)}
.q{font:700 clamp(1.4rem,3vw,1.9rem)/1.15 var(--f-head);margin:0 0 6px}
.qh{color:var(--ink2);margin:0 0 20px;font-size:.98rem}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.opts.list1{grid-template-columns:1fr;max-width:620px}
.opt{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;cursor:pointer;overflow:hidden;padding:0}
.opt:hover{border-color:var(--ink)}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.opt .art{border-bottom:1px solid var(--line)}
.opt .t{padding:10px 14px;font-weight:600;line-height:1.3}
.opt .t small{display:block;font-weight:400;color:var(--ink2);margin-top:2px;font-size:.86rem}
.opts.list1 .opt{flex-direction:row;align-items:center;gap:12px;padding:14px 16px}
.opts.list1 .opt .t{padding:0}
.box{width:22px;height:22px;flex:none;border:2px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center}
.opt.on .box{background:var(--ink)}
.opt.on .box::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--bg);border-bottom:2.5px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.navrow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.safety{display:flex;gap:12px;padding:12px 16px;background:var(--l3bg);color:var(--l3);border-radius:6px;font-size:.93rem;line-height:1.45;margin-top:18px;max-width:700px}
.safety svg{flex:none;margin-top:2px}
.safety b{color:inherit}
.result .banner{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px 20px;border-radius:8px;margin-bottom:18px}
.result .banner strong{font:700 3rem/1 var(--f-head)}
.result .banner h2{margin:0;font-size:1.5rem}
.result .banner p{margin:4px 0 0;font-size:.95rem}
.result .banner.l1{background:var(--l1bg);color:var(--l1)}
.result .banner.l2{background:var(--l2bg);color:var(--l2)}
.result .banner.l3{background:var(--l3bg);color:var(--l3)}
.result .banner p{color:var(--ink)}
.rsec{margin:22px 0;padding-top:14px;border-top:1px solid var(--line)}
.rsec h3{font:600 .76rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.rsec .list{margin-bottom:0}
.recap{display:flex;gap:8px;flex-wrap:wrap}
.recap span{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 10px;font-size:.86rem}
.urgent{border:2px solid var(--l3);border-radius:8px;padding:18px 20px;background:var(--surface);margin:0 0 20px}
.urgent h3{color:var(--l3);font-size:1.35rem;margin-bottom:8px}
.urgent .list{margin-bottom:0;font-size:1.02rem}

/* Checklist */
.cl{list-style:none;margin:20px 0;padding:0;display:grid;gap:8px;max-width:680px}
.cl label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.cl label:hover{border-color:var(--ink)}
.cl input{width:22px;height:22px;flex:none;accent-color:var(--ink);margin-top:2px}
.cl input:checked+span{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--accent)}
.field{display:block;margin:16px 0;max-width:680px}
.field>span{display:block;font:600 .74rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.field input,.field textarea{width:100%;padding:10px 12px;font:inherit;border:1.5px solid var(--ink);border-radius:6px;background:var(--surface);color:var(--ink)}
.field textarea{min-height:130px;resize:vertical}
.cl-prog{font:500 .85rem var(--f-mono);color:var(--ink3);margin:0}

/* Busca e glossário */
.results{list-style:none;margin:20px 0;padding:0;display:grid;gap:10px;max-width:760px}
.results a{display:block;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink)}
.results a:hover{border-color:var(--ink)}
.results .rt{font:700 1.1rem var(--f-head)}
.results .rk{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:2px}
.results p{margin:4px 0 0;color:var(--ink2);font-size:.92rem}
mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;padding:0 2px;border-radius:2px}
.gl{margin:18px 0;display:grid;gap:0;max-width:760px;border-top:1px solid var(--line)}
.gl>div{padding:12px 0;border-bottom:1px solid var(--line)}
.gl dt{font:700 1.08rem var(--f-head);margin:0}
.gl dd{margin:2px 0 0;color:var(--ink2);font-size:.97rem}

/* Navegação entre capítulos */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:60px}
.pager a{display:block;padding:14px 16px;border:1.5px solid var(--ink);border-radius:6px;text-decoration:none;color:var(--ink);background:var(--surface)}
.pager a:hover{background:var(--ink);color:var(--bg)}
.pager small{display:block;font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.pager .next{text-align:right;grid-column:2}
.pager .prev{grid-column:1}
.photoslot{margin:20px 0;padding:14px 16px;border:1px dashed var(--line);border-radius:6px;font-size:.88rem;color:var(--ink3);max-width:68ch}
.photos{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin:20px 0}
.photos figure{margin:0}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--line)}
.photos figcaption{font-size:.86rem;color:var(--ink2);padding-top:6px}
.foot{margin-top:70px;padding-top:18px;border-top:1px solid var(--line);font-size:.86rem;color:var(--ink3);max-width:68ch}
.crumbs{font:500 .78rem var(--f-mono);letter-spacing:.06em;margin-bottom:14px;color:var(--ink3)}
.crumbs a{color:var(--ink2)}
.cols2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:20px 0;align-items:start}
@media (max-width:760px){.cols2{grid-template-columns:1fr}}
.kv{display:grid;gap:18px;margin:20px 0;max-width:760px}
.kv h3{font:600 .76rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.kv .list,.kv p{margin:0}

/* Responsivo */
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .menu-btn,.search-link{display:inline-flex}
  .hdr-search{display:none}
  .brand-1{display:none}
  .brand-2{font-size:.98rem;overflow:hidden;text-overflow:ellipsis}
  .brand-t{min-width:0}
  .brand{flex:1 1 auto}
  .hdr-in{gap:8px}
  .nav{position:fixed;z-index:70;top:calc(var(--hh) + env(safe-area-inset-top,0px));bottom:0;left:0;width:min(86vw,330px);max-height:none;background:var(--surface);transform:translateX(-102%);transition:transform .2s ease;border-right:1px solid var(--ink);padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
  .nav.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;z-index:65;background:rgba(10,12,14,.5)}
  .page{padding-top:26px}
}
@media print{
  .hdr,.nav,.scrim,.no-print,.skip{display:none!important}
  .layout{display:block}body{background:#fff;color:#000;font-size:12pt}
  .page{max-width:none;padding:0}
}

.ph-thumb{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}

.acc summary.nothumb{grid-template-columns:1fr auto;padding-left:18px}
.acc-b .photos{margin-top:16px}

<script>
/* Fichas do guia de fissuras (Capítulo 2). Para incluir fotos, acrescente  photos: [{ src: 'assets/img/x.jpg', alt: '...', caption: '...' }]  à ficha.
   nivel: [mínimo, máximo] do nível de atenção PROVÁVEL. Padrão visual nunca confirma a causa. */
window.CRACKS = [
  {
    id: 'vertical', nome: 'Fissuras verticais', dg: 'crack-vertical', nivel: [1, 2],
    ve: 'Uma linha que desce na vertical, de cima para baixo, em parede, viga, pilar, muro ou laje.',
    causas: ['Retração: o concreto e a argamassa diminuem de volume ao secar, principalmente em paredes e muros compridos.', 'Variação de temperatura: o material dilata e contrai ao longo do dia e das estações.', 'Em vigas e lajes, esforços de flexão (o elemento "dobra" um pouco sob carga) podem gerar linhas verticais no meio do vão.', 'Movimento da fundação ou do solo (recalque), em casos menos comuns.'],
    significa: 'Muitas fissuras verticais são estáveis e não indicam risco. Mas, em vigas e lajes, principalmente no meio do vão, ou quando estão aumentando, a causa precisa ser confirmada por um profissional.',
    observar: ['Em que elemento aparece (parede de vedação ou estrutura).', 'Se atravessa o elemento de um lado a outro.', 'Se há umidade, ferrugem ou concreto solto por perto.', 'Se aumentou de comprimento ou de abertura nas últimas semanas.'],
    proximo: 'Fotografe com a data, registre a localização e acompanhe. Se estiver em viga, pilar ou laje, ou se estiver crescendo, peça avaliação profissional.',
    quem: 'Engenheiro civil. Engenheiro estrutural se o elemento for viga, pilar ou laje.'
  },
  {
    id: 'horizontal', nome: 'Fissuras horizontais', dg: 'crack-horizontal', nivel: [2, 3],
    ve: 'Uma linha deitada, na horizontal, em pilar, parede, muro ou encontro entre parede e laje.',
    causas: ['Em pilares: esforços de compressão elevados, corrosão da armadura ou falhas de execução, como juntas de concretagem mal feitas.', 'Em muros e paredes de subsolo: empuxo (pressão) do solo ou da água do lado de dentro.', 'No encontro da parede com a laje: movimentação ou deformação da laje.', 'Retração ou variação térmica, em casos superficiais.'],
    significa: 'Em pilares e em muros que seguram terra, uma fissura horizontal merece mais cuidado que uma vertical. Pode ser algo localizado, mas só uma avaliação presencial diz.',
    observar: ['Se o pilar ou muro parece ter saído do prumo (inclinado).', 'Se a fissura é mais aberta de um lado.', 'Se há ferrugem, umidade ou lascas de concreto.', 'Se há outros sinais na região, como piso afundando ou portas travando.'],
    proximo: 'Se for em pilar, muro de arrimo ou parede de subsolo, procure avaliação profissional. Não faça reparo antes.',
    quem: 'Engenheiro estrutural. Defesa Civil se houver inclinação evidente ou queda de material.'
  },
  {
    id: 'diagonal', nome: 'Fissuras diagonais', dg: 'crack-diagonal', nivel: [2, 3],
    ve: 'Uma linha inclinada, geralmente a cerca de 45 graus, em viga, pilar, laje ou parede.',
    causas: ['Em vigas, perto dos apoios: esforço cortante (o elemento tende a "cisalhar").', 'Em alvenaria: concentração de esforços nos cantos de portas e janelas, ou recalque diferencial (um lado da construção cede mais que o outro).', 'Em lajes: deformação excessiva ou apoio inadequado.'],
    significa: 'Em elementos estruturais, a fissura diagonal costuma ser tratada com prioridade por engenheiros. Em paredes de vedação pode ter causas mais simples, mas só uma avaliação confirma.',
    observar: ['Se está perto do apoio de uma viga, do encontro viga-pilar ou do canto de uma laje.', 'Se a abertura é maior em uma ponta.', 'Se é recente ou se cresce.', 'Se há outras fissuras no mesmo conjunto.'],
    proximo: 'Em viga, pilar ou laje: avaliação profissional. Se surgiu ou cresceu rápido, trate como urgente.',
    quem: 'Engenheiro estrutural.'
  },
  {
    id: 'encontro', nome: 'Fissuras junto a pilares e vigas', dg: 'wall', nivel: [1, 2],
    ve: 'Uma linha na emenda entre a parede e o pilar, ou entre a parede e a viga ou laje de cima.',
    causas: ['Materiais diferentes (concreto e tijolo) se movimentam de forma diferente.', 'Retração e variação de temperatura.', 'Deformação da viga ou da laje apoiada sobre a parede.', 'Falta de tela ou de amarração entre parede e estrutura.'],
    significa: 'Quando a fissura fica só na emenda e na alvenaria, costuma ser de acomodação entre materiais. O que muda o quadro é se o concreto também está fissurado ou se a linha vem crescendo.',
    observar: ['Se a fissura se prolonga para dentro do pilar ou da viga.', 'Se a laje de cima apresenta barriga.', 'Se a abertura varia com o tempo ou com a estação do ano.'],
    proximo: 'Fotografe e acompanhe. Se aparecer no concreto, estiver crescendo ou vier com deformação, peça avaliação.',
    quem: 'Engenheiro civil.'
  },
  {
    id: 'lajes', nome: 'Fissuras em lajes', dg: 'slab', nivel: [2, 3],
    ve: 'Linhas no teto ou no piso, partindo dos cantos, cruzando o meio da laje ou acompanhando as vigas.',
    causas: ['Retração do concreto ao secar.', 'Flexão por carga maior que a prevista ou deformação excessiva.', 'Variação térmica, principalmente em lajes de cobertura.', 'Infiltração e corrosão da armadura.'],
    significa: 'Fissuras finas e estáveis podem ser de retração. Já fissuras com barriga, umidade, ferrugem ou concreto soltando pedem avaliação. Laje é elemento estrutural e o seu comportamento só pode ser julgado por um profissional.',
    observar: ['Se o teto está abaulado ("barriga").', 'Se há manchas de umidade ou de ferrugem.', 'Se o piso de cima está trincando no mesmo traçado.', 'Se a fissura aparece de um lado e do outro da laje.'],
    proximo: 'Registre com fotos do teto e do piso. Chame engenheiro para avaliar. Evite colocar peso extra (reservatórios, entulho, móveis pesados) sobre a área até a avaliação.',
    quem: 'Engenheiro estrutural ou engenheiro civil com experiência em inspeção predial.'
  },
  {
    id: 'alvenaria', nome: 'Fissuras em paredes de alvenaria', dg: 'wall', nivel: [1, 2],
    ve: 'Linhas em paredes de tijolo ou bloco, em geral no reboco, na pintura ou nos cantos de portas e janelas.',
    causas: ['Retração da argamassa e do reboco.', 'Falta de vergas e contravergas (pequenas vigas acima e abaixo de portas e janelas).', 'Dilatação térmica.', 'Deformação da estrutura de concreto que a parede acompanha.', 'Recalque da fundação.'],
    significa: 'A parede pode estar apenas respondendo a uma movimentação da própria estrutura. Por isso, uma fissura na parede pode ter origem estrutural ou não, e só uma avaliação diferencia.',

    proximo: 'Fotografe, acompanhe e consulte um engenheiro se houver várias paredes com o mesmo padrão ou outros sinais.',
    quem: 'Engenheiro civil.'
  },
  {
    id: 'superficial', nome: 'Fissuras superficiais', dg: 'superficial', nivel: [1, 1],
    ve: 'Linhas muito finas, curtas e desordenadas, em forma de rede ("craquelê" ou "mapa"), só na superfície.',
    causas: ['Secagem rápida do reboco, da massa ou do concreto, com perda de água muito veloz.', 'Camada de acabamento mal dosada ou muito espessa.', 'Pequenas movimentações do revestimento.'],
    significa: 'Com frequência ficam só na camada de acabamento. Mesmo assim, podem deixar a água entrar com o tempo.',
    observar: ['Se são realmente rasas e não crescem.', 'Se há umidade ou manchas associadas.', 'Se em algum ponto a linha se destaca das demais e se prolonga.'],
    proximo: 'Registrar e acompanhar. Se for um problema de acabamento, confirme isso com um profissional antes de tratar.',
    quem: 'Engenheiro civil ou profissional de acabamentos, para confirmar que é superficial.'
  },
  {
    id: 'atravessa', nome: 'Fissuras que atravessam o elemento', dg: 'through', nivel: [2, 3],
    ve: 'A mesma fissura aparece dos dois lados da parede, da laje ou da viga, ou deixa passar luz ou água.',
    causas: ['Esforços que atingem a espessura inteira do elemento.', 'Movimentação ou recalque.', 'Retração com restrição, em peças longas.'],
    significa: 'Uma fissura que atravessa tem profundidade total. Isso a torna mais relevante, principalmente em elemento estrutural ou quando permite passagem de água.',
    observar: ['Se existe o mesmo traçado dos dois lados.', 'Se há água ou luz passando.', 'Se há manchas de umidade, ferrugem ou depósitos brancos ao longo do traçado.'],
    proximo: 'Fotografe os dois lados. Peça avaliação profissional, principalmente se for em laje, viga, pilar ou muro de contenção.',
    quem: 'Engenheiro estrutural.'
  },
  {

  const ICON = {

    warn: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l10 18H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 17.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',

  const chips = r => r[0] === r[1] ? chip(r[0]) : chip(r[0]) + chip(r[1]);

  /* ---------- Blocos de conteúdo ---------- */
  const BL = {

    ul: b => `<ul class="list">${b.items.map(i => `<li>${md(i)}</li>`).join('')}</ul>`,

    call: b => `<aside class="call ${b.k || 'info'}"><div class="call-h">${ICON[b.k] || ICON.info}<strong>${b.h}</strong></div>${b.x ? `<p>${md(b.x)}</p>` : ''}${b.items ? `<ul class="list">${b.items.map(i => `<li>${md(i)}</li>`).join('')}</ul>` : ''}</aside>`,
    fig: (b, c) => { if (!b.photo) return ''; c.fig++; return `<figure class="fig"><div class="fig-art"><img class="ph-thumb" src="${esc(b.photo)}" alt="${esc(plain(b.cap))}" loading="lazy"></div><figcaption><span class="mono">FIG. ${c.n}.${c.fig}</span>${md(b.cap)}</figcaption></figure>`; },
    cmp: b => `<div class="tablewrap"><table class="cmp"><thead><tr>${b.head.map(h => `<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
    four: () => `<div class="four">${window.FOUR.map(f => `<div><h3><span class="mono">${f.n}</span>${f.h}</h3><p>${f.p}</p></div>`).join('')}</div>`,
    flow: () => `<ol class="flow">${window.FLOW.map(f => `<li><b>${f.h}</b>${f.p}</li>`).join('')}</ol>`,
    cols: b => `<div class="cols2">${[b.a, b.b].map((x, i) => `<aside class="call ${i === 0 ? 'ok' : 'danger'}" style="margin:0"><div class="call-h">${ICON[i === 0 ? 'ok' : 'danger']}<strong>${x.h}</strong></div><ul class="list">${x.items.map(t => `<li>${md(t)}</li>`).join('')}</ul></aside>`).join('')}</div>`,
    cracks: () => CR.map((c, i) => crackCard(c, i === 0)).join(''),
    levels: () => `<div class="levels">${window.LEVELS.map(l => `<div class="level l${l.n}"><div class="side"><span>Nível</span><strong>${l.n}</strong></div><div class="body"><h3>${l.nome}</h3><p style="margin:0">${l.resumo}</p><h4>Exemplos</h4><ul class="list">${l.exemplos.map(e => `<li>${e}</li>`).join('')}</ul><h4>O que fazer</h4><ul class="list">${l.fazer.map(e => `<li>${e}</li>`).join('')}</ul></div></div>`).join('')}</div>`,
    diy: () => { const d = window.DIY; return `<div class="diy"><div class="yes"><h3>${d.ok.h}</h3><p style="font-size:.95rem">${d.ok.intro}</p><ul class="list">${d.ok.items.map(i => `<li>${i}</li>`).join('')}</ul></div><div class="no"><h3>${d.no.h}</h3><ul class="list">${d.no.items.map(i => `<li>${i}</li>`).join('')}</ul></div></div>`; },
    who: () => `<div class="who">${window.WHO.map(w => `<div class="${w.emerg ? 'emerg' : ''}"><h3>${w.h}</h3><p>${w.p}</p>${w.emerg ? '<p style="margin-top:8px">Bombeiros: <span class="phone">193</span> &nbsp; Defesa Civil: <span class="phone">199</span></p>' : ''}</div>`).join('')}</div>`,
    gloss: () => glossaryHTML(''),
    lib: b => `<div class="grid">${b.ids.map(id => libCard(libById(id))).join('')}</div>`
  };
  const renderBlocks = (bl, ctx) => bl.map(b => BL[b.t](b, ctx)).join('');

  function crackCard(c, open) {
    const ph = c.photos && c.photos[0];
    return `<details class="acc" id="crack-${c.id}"${open ? ' open' : ''}>
      <summary${ph ? '' : ' class="nothumb"'}>${ph ? `<div class="thumb"><img class="ph-thumb" src="${esc(ph.src)}" alt="${esc(ph.alt || c.nome)}" loading="lazy"></div>` : ''}<div><h3>${c.nome}</h3><div class="chips">${chips(c.nivel)}</div></div></summary>
      <div class="acc-b"><dl>
        <div><dt>O que você está vendo</dt><dd><p>${c.ve}</p></dd></div>
        <div><dt>Possíveis causas (hipóteses)</dt><dd><ul>${c.causas.map(x => `<li>${x}</li>`).join('')}</ul></dd></div>
        <div><dt>O que pode significar</dt><dd><p>${c.significa}</p></dd></div>
        <div><dt>O que observar</dt><dd><ul>${c.observar.map(x => `<li>${x}</li>`).join('')}</ul></dd></div>
        <div><dt>Nível de atenção provável</dt><dd>${chips(c.nivel)} <p style="margin-top:6px;font-size:.9rem;color:var(--ink2)">Depende do conjunto de sinais. Veja o capítulo 8.</p></dd></div>
        <div><dt>Próximo passo recomendado</dt><dd><p>${c.proximo}</p></dd></div>
        <div><dt>Quem procurar</dt><dd><p>${c.quem}</p></dd></div>
      </dl>${c.photos && c.photos.length ? `<div class="photos">${c.photos.map(p => `<figure><img src="${esc(p.src)}" alt="${esc(p.alt || c.nome)}" loading="lazy"><figcaption>${esc(p.caption || '')}${p.credit ? ' · ' + esc(p.credit) : ''}</figcaption></figure>`).join('')}</div>` : ''}</div></details>`;
  }
  function libArt(m) {
    const p = m.photos && m.photos[0];
    return p ? `<div class="card-art"><img class="ph-thumb" src="${esc(p.src)}" alt="${esc(p.alt || m.nome)}" loading="lazy"></div>` : '';
  }
  function libCard(m) {
    return `<a class="card" href="#manifestacao-${m.id}">${libArt(m)}<div class="card-b"><h3>${m.nome}</h3><p>${m.short}</p><span class="card-go">Entenda o que pode ser →</span></div></a>`;
  }
  function glossaryHTML(q) {
    const nq = norm(q);
    const items = GL.filter(g => !nq || norm(g.t + ' ' + g.d).includes(nq));
    if (!items.length) return '<p>Nenhum termo encontrado.</p>';
    return `<dl class="gl">${items.map(g => `<div id="gl-${norm(g.t).replace(/ /g, '-')}"><dt>${g.t}</dt><dd>${g.d}</dd></div>`).join('')}</dl>`;
  }

  /* ---------- Vídeos ---------- */
  const vById = id => VIDEOS.find(v => v.id === id);
  const catName = id => (VCATS.find(c => c.id === id) || {}).nome || id;
  function vCard(v) {
    const thumb = v.thumb ? `<img src="${esc(v.thumb)}" alt="" loading="lazy">` : '';
    return `<button type="button" class="card" data-video="${esc(v.id)}"><div class="vthumb${v.thumb ? '' : ' ph'}">${thumb}<span class="play">${ICON.play}</span>${v.duration ? `<span class="dur">${esc(v.duration)}</span>` : ''}</div><div class="card-b"><span class="mono" style="color:var(--accent-ink)">${esc(catName(v.category)).toUpperCase()}</span><h3>${esc(v.title)}</h3><p>${esc(v.desc || '')}</p><span class="card-go">Assistir →</span></div></button>`;
  }
  function videoSlotFor(filter, label) {
    const list = VIDEOS.filter(filter);
    if (list.length) return `<div class="vbox"><h2>Aprenda também em vídeo</h2>${list.map(vCard).join('')}</div>`;
    return `<div class="vslot">${ICON.film}<span>${label || 'Este assunto contará com vídeo explicativo em breve. O conteúdo escrito abaixo está completo.'}</span></div>`;
  }
  function openVideo(id) {
    const v = vById(id); if (!v) return;
    closeVideo();
    let player;
    if (v.type === 'youtube') player = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.src)}" title="${esc(v.title)}" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    else if (v.type === 'vimeo') player = `<iframe src="https://player.vimeo.com/video/${encodeURIComponent(v.src)}" title="${esc(v.title)}" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    else player = `<video controls preload="metadata" ${v.thumb ? `poster="${esc(v.thumb)}"` : ''} src="${esc(v.src)}">Seu navegador não reproduz este vídeo.</video>`;
    const m = document.createElement('div');
    m.className = 'vmodal'; m.id = 'vmodal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', v.title);
    m.innerHTML = `<div class="vmodal-in"><div class="vmodal-x"><button type="button" class="btn sm" data-close-video>Fechar ✕</button></div><div class="vmodal-player">${player}</div><div class="vmodal-meta"><h3>${esc(v.title)}</h3><p>${esc(v.desc || '')}</p><p class="mono">${esc(catName(v.category))}${v.duration ? ' · ' + esc(v.duration) : ''}${v.date ? ' · ' + esc(v.date) : ''}</p>${v.chapter ? `<a href="#cap-${v.chapter}" data-close-video>Ler o capítulo ${v.chapter} →</a>` : ''}</div></div>`;
    document.body.appendChild(m);
    m._prev = document.activeElement;
    $('[data-close-video]', m).focus();
  }
  function closeVideo() { const m = $('#vmodal'); if (m) { const p = m._prev; m.remove(); if (p && p.focus) p.focus(); } }

  /* ---------- Busca ---------- */
  const STOP = new Set('de do da dos das no na nos nas em a o e os as um uma uns umas com que para por meu minha meus minhas tem esta esse essa isso ao aos se foi ser ha mais muito'.split(' '));
  const SYN = {
    rachadura: ['fissura', 'trinca'], trinca: ['fissura', 'rachadura'], fissura: ['trinca', 'rachadura'], rachando: ['fissura', 'rachadura'],
    ferro: ['armadura', 'vergalhao'], vergalhao: ['armadura', 'ferro'], ferragem: ['armadura'],
    caindo: ['desplacamento', 'soltando'], soltando: ['desplacamento', 'caindo'], esfarelando: ['desplacamento'], lasca: ['desplacamento'],
    barriga: ['flecha', 'deformacao', 'abaulada'], abaulada: ['flecha', 'deformacao', 'barriga'], arqueada: ['flecha', 'deformacao'],
    salitre: ['eflorescencia'], branca: ['eflorescencia'], branco: ['eflorescencia'],
    ferrugem: ['corrosao', 'armadura'], enferrujado: ['ferrugem', 'corrosao'], marrom: ['ferrugem'],
    infiltracao: ['umidade', 'vazamento'], goteira: ['infiltracao', 'umidade'], vazamento: ['infiltracao', 'umidade'], mofo: ['umidade'],
    teto: ['laje'], bicheira: ['segregacao'], brita: ['segregacao'], desnivelado: ['deformacao', 'recalque'], afundando: ['recalque']
  };
  const stem = t => t.length > 4 && t.endsWith('s') ? t.slice(0, -1) : t;
  const tokens = q => norm(q).split(' ').filter(t => t && !STOP.has(t)).map(stem);
  let INDEX = null;
  function buildIndex() {
    INDEX = [];
    CH.forEach(c => c.sections.forEach((s, i) => {
      const txt = s.blocks.map(b => {
        if (b.x) return b.x; if (b.items) return b.items.join(' ');
        if (b.rows) return b.rows.map(r => r.join(' ')).join(' ');
        if (b.t === 'cracks') return CR.map(x => x.nome + ' ' + x.ve).join(' ');
        if (b.t === 'levels') return window.LEVELS.map(l => l.nome + ' ' + l.exemplos.join(' ')).join(' ');
        if (b.t === 'diy') return window.DIY.ok.items.concat(window.DIY.no.items).join(' ');
        if (b.t === 'who') return window.WHO.map(w => w.h + ' ' + w.p).join(' ');
        if (b.cap) return b.cap; return '';
      }).join(' ');
      INDEX.push({ kind: 'Capítulo ' + c.n, title: c.short === c.title ? c.title : c.title, sub: s.h, url: '#' + c.slug, text: plain(txt), kw: c.title + ' ' + s.h });
    }));
    LIB.forEach(m => INDEX.push({ kind: 'Manifestação', title: m.nome, sub: m.short, url: '#manifestacao-' + m.id, text: plain([m.ve, m.significa, ...m.causas, ...m.observar, ...m.agora, ...m.evitar, m.quem].join(' ')), kw: m.kw + ' ' + m.nome }));
    CR.forEach(c => INDEX.push({ kind: 'Guia de fissuras', title: c.nome, sub: c.ve, url: '#cap-2', text: plain([c.ve, c.significa, ...c.causas, ...c.observar, c.proximo, c.quem].join(' ')), kw: c.nome }));
    GL.forEach(g => INDEX.push({ kind: 'Glossário', title: g.t, sub: g.d, url: '#cap-10', text: g.d, kw: g.t }));
    VIDEOS.forEach(v => INDEX.push({ kind: 'Vídeo', title: v.title, sub: v.desc || '', url: '#videos', text: v.desc || '', kw: v.category + ' ' + v.title }));
    INDEX.push({ kind: 'Ferramenta', title: 'O que você encontrou?', sub: 'Responda perguntas simples e receba uma orientação educativa.', url: '#identificar', text: 'identificar triagem ferramenta o que encontrei nivel de atencao', kw: 'identificar triagem ferramenta' });
    INDEX.push({ kind: 'Ferramenta', title: 'Antes de chamar um profissional, registre isso', sub: 'Checklist para fotografar e anotar.', url: '#checklist', text: 'checklist registrar fotografar anotar profissional', kw: 'checklist registro fotos' });
    INDEX.forEach(e => { e.nt = norm(e.title + ' ' + e.sub); e.nk = norm(e.kw); e.nx = norm(e.text); });
  }
  function search(q) {
    if (!INDEX) buildIndex();
    const nq = norm(q); const base = tokens(q); if (!base.length) return [];
    const exp = []; base.forEach(t => (SYN[t] || []).forEach(s => { if (!base.includes(stem(s))) exp.push(stem(s)); }));
    const res = [];
    INDEX.forEach(e => {
      let sc = 0;
      base.forEach(t => { if (e.nt.includes(t)) sc += 6; if (e.nk.includes(t)) sc += 5; const m = e.nx.split(t).length - 1; sc += Math.min(m, 3); });
      exp.forEach(t => { if (e.nt.includes(t)) sc += 3; if (e.nk.includes(t)) sc += 2.5; const m = e.nx.split(t).length - 1; sc += Math.min(m, 2) * 0.5; });
      if (nq.length > 3 && (e.nt.includes(nq) || e.nk.includes(nq))) sc += 8;
      if (sc > 0) res.push({ e, sc });
    });
    res.sort((a, b) => b.sc - a.sc);
    const seen = new Set(), out = [];
    for (const r of res) { const k = r.e.url + r.e.title; if (seen.has(k)) continue; seen.add(k); out.push(r); if (out.length >= 14) break; }
    return out;
  }
  function snippet(e, terms) {
    const t = e.text; const nt = norm(t);
    let at = -1; for (const w of terms) { at = nt.indexOf(w); if (at >= 0) break; }
    if (at < 0) return esc((e.sub || t).slice(0, 150));
    const start = Math.max(0, at - 50); let s = t.slice(start, start + 190);
    return (start > 0 ? '…' : '') + esc(s) + '…';
  }

  /* ---------- Páginas ---------- */
  let lastQuery = '';
  const PAGES = {};

  PAGES.inicio = () => ({
    title: SITE, desc: document.querySelector('meta[name="description"]').content, wide: true,
    html: `<div class="hero">
      <p class="eyebrow">Guia para pessoas comuns</p>
      <h1>O que está acontecendo com o seu concreto?</h1>
      <p class="lead">Entenda os sinais, reconheça possíveis problemas e saiba qual é o próximo passo.</p>
      <form class="bigsearch" id="homeSearch" role="search"><label class="sr" for="homeQ">Descreva o que você viu</label><input id="homeQ" type="search" placeholder="Ex.: mancha branca no concreto" autocomplete="off"><button class="btn primary" type="submit">Pesquisar</button></form>
      <p class="try">Experimente:</p>
      <div class="chips">${['mancha branca no concreto', 'fissura diagonal na viga', 'ferrugem no teto', 'concreto caindo', 'rachadura no pilar', 'laje com barriga'].map(q => `<a class="chip" href="#busca" data-q="${q}">${q}</a>`).join('')}</div>
      <div class="disc">${ICON.info}<span>Este site é um <strong>guia educativo</strong> e não substitui uma inspeção presencial feita por profissional habilitado. Em caso de queda de concreto, estalos ou deformação súbita, afaste-se e ligue para os Bombeiros (193) ou a Defesa Civil (199).</span></div>
    </div>
    <section class="sec"><h2>O que você está vendo?</h2><div class="grid shortcuts">${LIB.map(m => `<a class="card" href="#manifestacao-${m.id}">${libArt(m)}<div class="card-b"><h3>${m.nome}</h3></div></a>`).join('')}</div></section>
    <section class="sec"><h2>Encontrou um problema? Comece por aqui.</h2>${BL.flow()}<div class="navrow"><a class="btn primary" href="#identificar">Usar a ferramenta “O que você encontrou?”</a><a class="btn" href="#checklist">Registrar antes de chamar um profissional</a></div></section>
    <section class="sec"><h2>Três níveis de atenção</h2><p>Uma triagem educativa para decidir o próximo passo. Não é diagnóstico nem garantia de segurança.</p><div class="three">${window.LEVELS.map(l => `<div class="lcard l${l.n}">${chip(l.n)}<h3>${l.nome}</h3><p>${l.resumo}</p></div>`).join('')}</div><a href="#cap-8">Ler o capítulo 8 →</a></section>
    <section class="sec"><h2>Posso consertar sozinho?</h2><p>Algumas tarefas de manutenção são simples. Outras nunca devem ser feitas sem avaliação profissional. Saiba a diferença.</p><a class="btn" href="#cap-9">Ver o capítulo 9</a></section>
    <section class="sec"><h2>O manual, capítulo por capítulo</h2><div class="grid">${CH.map(c => `<a class="card" href="#${c.slug}"><div class="card-b"><span class="mono" style="color:var(--accent-ink)">CAPÍTULO ${String(c.n).padStart(2, '0')}</span><h3>${c.title}</h3><p>${c.lead}</p></div></a>`).join('')}</div></section>
    <section class="sec"><h2>Aprenda também em vídeo</h2>${VIDEOS.length ? `<div class="grid">${VIDEOS.slice(-3).reverse().map(vCard).join('')}</div><a class="btn" href="#videos">Ver todos os vídeos</a>` : `<div class="vslot">${ICON.film}<span>A biblioteca de vídeos educativos está em preparação.</span></div>`}</section>`
  });

  function chapterPage(c) {
    const ctx = { n: c.n, fig: 0 };
    const secs = c.sections.map((s, i) => `<section class="sec" id="sec-${i}"><h2>${s.h}</h2>${renderBlocks(s.blocks, ctx)}</section>`);
    const vid = c.video ? videoSlotFor(v => v.chapter === c.n || v.category === c.video) : '';
    const prev = CH[c.n - 2], next = CH[c.n];
    return {
      title: `Capítulo ${c.n}: ${c.title} · ${SITE}`, desc: c.desc, progress: true,
      html: `<p class="eyebrow">Capítulo ${String(c.n).padStart(2, '0')} de ${CH.length}</p><h1>${c.title}</h1><p class="lead">${c.lead}</p>
        ${c.sections.length > 1 ? `<nav class="toc" aria-label="Neste capítulo">${c.sections.map((s, i) => `<button type="button" class="linklike" data-scroll="sec-${i}">${s.h}</button>`).join('')}</nav>` : ''}
        ${vid}${secs.join('')}
        <nav class="pager" aria-label="Navegação entre capítulos">${prev ? `<a class="prev" href="#${prev.slug}"><small>← Capítulo anterior</small>${prev.title}</a>` : '<span></span>'}${next ? `<a class="next" href="#${next.slug}"><small>Próximo capítulo →</small>${next.title}</a>` : ''}</nav>
        <p class="foot">Conteúdo educativo. Não substitui inspeção presencial por profissional habilitado.</p>`
    };
  }

  PAGES.manifestacao = id => {
    const m = libById(id); if (!m) return PAGES.naoencontrada();
    const vids = videoSlotFor(v => v.manifest === m.id, 'Vídeo sobre este assunto em preparação.');
    const photos = m.photos && m.photos.length
      ? `<div class="photos">${m.photos.map(p => `<figure><img src="${esc(p.src)}" alt="${esc(p.alt || m.nome)}" loading="lazy"><figcaption>${esc(p.caption || '')}${p.credit ? ' · ' + esc(p.credit) : ''}</figcaption></figure>`).join('')}</div>`
      : '';
    const L = a => `<ul class="list">${a.map(x => `<li>${x}</li>`).join('')}</ul>`;
    return {
      title: `${m.nome} · ${SITE}`, desc: m.short + ' ' + m.significa.slice(0, 110),

  function triage(S) {

    if (oth.includes('portas') && ['linha', 'diagonal', 'abaulada'].includes(S.obs)) up(3, 'Portas ou janelas travando junto com fissuras ou deformação.');
    if (L === 1) why.push('Não foram indicados sinais adicionais de agravamento nas respostas.');
    return { level: L, urgent: false, why };
  }

        <ul class="cl">${CHECK.map((c, i) => `<li><label><input type="checkbox" data-ci="${i}"${st.c[i] ? ' checked' : ''}><span>${c}</span></label></li>`).join('')}</ul>
        <p class="cl-prog" id="clProg"></p>
        <label class="field"><span>Onde está (cômodo, andar, elemento)</span><input id="clWhere" type="text" value="${esc(st.where || '')}" placeholder="Ex.: teto da varanda, 2º andar, viga sobre a porta"></label>
        <label class="field"><span>Observações</span><textarea id="clNotes" placeholder="Quando percebeu, se aumentou, se choveu, o que mudou perto…">${esc(st.notes || '')}</textarea></label>
        <div class="navrow no-print"><button type="button" class="btn primary" id="clCopy">Copiar resumo</button><button type="button" class="btn" id="clClear">Limpar</button><button type="button" class="btn" id="clPrint" hidden>Imprimir ou salvar em PDF</button></div>
        <p id="clMsg" class="mono" role="status" style="margin-top:10px;color:var(--ink3)"></p>
        <p class="foot">Seus registros ficam apenas neste navegador. Cole o resumo em uma mensagem ou e-mail para o profissional e anexe as fotos.</p>`,
      after() {
        const save = () => store.set('mpc-check', { c: $$('[data-ci]').map(x => x.checked), notes: $('#clNotes').value, where: $('#clWhere').value });
        const prog = () => { const n = $$('[data-ci]').filter(x => x.checked).length; $('#clProg').textContent = `${n} de ${CHECK.length} itens`; };
        prog();
        $$('[data-ci]').forEach(x => x.addEventListener('change', () => { save(); prog(); }));
        $('#clNotes').addEventListener('input', save); $('#clWhere').addEventListener('input', save);
        const summary = () => `REGISTRO DE OBSERVAÇÃO (${new Date().toLocaleDateString('pt-BR')})\nLocal: ${$('#clWhere').value || '—'}\n\n` + CHECK.map((c, i) => `[${$$('[data-ci]')[i].checked ? 'x' : ' '}] ${c}`).join('\n') + `\n\nObservações:\n${$('#clNotes').value || '—'}\n\nGerado em ${SITE}. Material educativo, não substitui inspeção profissional.`;
        const msg = t => { $('#clMsg').textContent = t; };
        $('#clCopy').addEventListener('click', () => {
          const txt = summary();
          const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { } ta.remove(); msg(ok ? 'Resumo copiado.' : 'Não foi possível copiar. Selecione e copie o texto manualmente.'); };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => msg('Resumo copiado.'), fallback); else fallback();
        });
        $('#clClear').addEventListener('click', () => { $$('[data-ci]').forEach(x => x.checked = false); $('#clNotes').value = ''; $('#clWhere').value = ''; save(); prog(); msg('Checklist limpo.'); });
        let framed = false; try { framed = window.top !== window.self; } catch (e) { framed = true; }
        if (!framed) { const p = $('#clPrint'); p.hidden = false; p.addEventListener('click', () => window.print()); }
      }
    };
  };

  PAGES.sobre = () => ({
    title: `Sobre e avisos · ${SITE}`, desc: 'Natureza educativa do manual, limites, fundamentação e como o conteúdo é organizado.',
    html: `<p class="eyebrow">Sobre</p><h1>Sobre este manual</h1><p class="lead">Um guia de consulta para pessoas que não são da área da engenharia.</p>
      <section class="sec"><h2>Aviso importante</h2><div class="call danger"><div class="call-h">${ICON.danger}<strong>Guia educativo</strong></div><p>O conteúdo deste site é educativo e <strong>não substitui a inspeção presencial de um profissional habilitado</strong>. Fotos e respostas a questionários não permitem afirmar que uma estrutura é segura ou que está comprometida.</p></div></section>
      <section class="sec"><h2>O que o manual diferencia</h2>${BL.four()}</section>
      <section class="sec"><h2>Fundamentação</h2><p>O conteúdo se baseia em conhecimentos consolidados de engenharia civil sobre patologia das construções. O manual evita citar limites numéricos de abertura de fissuras e critérios de avaliação isolados, porque a gravidade depende do conjunto de sinais. Normas citadas no capítulo 9 são mencionadas apenas pelo nome, e devem ser consultadas na ABNT em sua versão vigente.</p></section>
      <section class="sec"><h2>Telefones de emergência</h2><p>Bombeiros: <span class="phone">193</span><br>Defesa Civil: <span class="phone">199</span></p></section>`
  });

  PAGES.naoencontrada = () => ({
    title: `Página não encontrada · ${SITE}`, desc: '',
    html: `<h1>Página não encontrada</h1><p class="lead">Esse endereço não existe no manual.</p><p><a class="btn primary" href="#inicio">Ir para o início</a></p>`
  });

  /* ---------- Navegação lateral ---------- */
  function buildNav() {
    const pad = n => String(n).padStart(2, '0');
    $('#nav').innerHTML = `<h2>Manual</h2><ul><li><a href="#inicio"><span class="n">·</span>Início</a></li></ul>
      <h2>Capítulos</h2><ul>${CH.map(c => `<li><a href="#${c.slug}"><span class="n">${pad(c.n)}</span>${c.short}</a></li>`).join('')}</ul>
      <h2>Ferramentas</h2><ul><li><a href="#identificar"><span class="n">→</span>O que você encontrou?</a></li><li><a href="#checklist"><span class="n">→</span>Checklist de registro</a></li><li><a href="#biblioteca"><span class="n">→</span>Biblioteca visual</a></li><li><a href="#videos"><span class="n">→</span>Vídeos</a></li><li><a href="#busca"><span class="n">→</span>Pesquisar</a></li></ul>
      <h2>Mais</h2><ul><li><a href="#sobre"><span class="n">i</span>Sobre e avisos</a></li></ul>`;
  }
  function markNav(route) {
    const hrefs = { inicio: '#inicio', biblioteca: '#biblioteca', identificar: '#identificar', checklist: '#checklist', videos: '#videos', busca: '#busca', sobre: '#sobre' };
    let target = hrefs[route] || (route.startsWith('cap-') ? '#' + route : route.startsWith('manifestacao-') ? '#biblioteca' : '');
    $$('#nav a').forEach(a => { if (a.getAttribute('href') === target) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }

  /* ---------- Roteador ---------- */
  function route() {
    closeVideo();
    let r = (location.hash || '').replace(/^#/, '') || 'inicio';
    let page;
    if (r.startsWith('cap-')) { const c = CH.find(x => x.slug === r); page = c ? chapterPage(c) : PAGES.naoencontrada(); }
    else if (r.startsWith('manifestacao-')) page = PAGES.manifestacao(r.slice(13));
    else if (PAGES[r] && r !== 'manifestacao' && r !== 'naoencontrada') page = PAGES[r]();
    else { page = PAGES.naoencontrada(); r = ''; }
    $('#main').innerHTML = `<div class="page${page.wide ? ' wide' : ''}">${page.html}</div>`;
    document.title = page.title;
    const md_ = $('meta[name="description"]'); if (md_ && page.desc) md_.setAttribute('content', page.desc);
    markNav(r);
    $('#bar').style.width = '0';
    $('#bar').dataset.on = page.progress ? '1' : '';
    closeMenu();
    window.scrollTo(0, 0);
    const main = $('#main'); main.focus({ preventScroll: true });
    if (page.after) page.after();
    onScroll();
  }

  /* ---------- Menu, tema, rolagem ---------- */
  function openMenu() { $('#nav').classList.add('open'); $('#scrim').classList.add('show'); $('#menuBtn').setAttribute('aria-expanded', 'true'); }
  function closeMenu() { $('#nav').classList.remove('open'); $('#scrim').classList.remove('show'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }
  function onScroll() {
    const bar = $('#bar'); if (!bar.dataset.on) { bar.style.width = '0'; return; }
    const pg = $('.page'); if (!pg) return;
    const top = pg.getBoundingClientRect().top + window.scrollY, h = pg.offsetHeight - window.innerHeight;
    const p = h > 0 ? Math.min(1, Math.max(0, (window.scrollY - top) / h)) : 1;
    bar.style.width = (p * 100).toFixed(1) + '%';
  }
  function setTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }

  function init() {
    document.documentElement.lang = 'pt-BR';
    buildNav();
    const saved = store.get('mpc-theme', null); if (saved) setTheme(saved);
    $('#themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const nx = cur === 'dark' ? 'light' : 'dark'; setTheme(nx); store.set('mpc-theme', nx);
    });
    $('#menuBtn').addEventListener('click', () => $('#nav').classList.contains('open') ? closeMenu() : openMenu());
    $('#scrim').addEventListener('click', closeMenu);
    $('#skip').addEventListener('click', () => $('#main').focus());
    $('#hdrSearch').addEventListener('submit', e => { e.preventDefault(); lastQuery = $('#hdrQ').value; $('#hdrQ').value = ''; if (location.hash === '#busca') route(); else location.hash = 'busca'; });
    document.addEventListener('submit', e => {
      if (e.target.id === 'homeSearch') { e.preventDefault(); lastQuery = $('#homeQ').value; location.hash = 'busca'; }
    });
    document.addEventListener('click', e => {
      const q = e.target.closest('[data-q]'); if (q) { lastQuery = q.dataset.q; if (location.hash === '#busca') { e.preventDefault(); route(); } return; }
      const v = e.target.closest('[data-video]'); if (v) { openVideo(v.dataset.video); return; }
      if (e.target.closest('[data-close-video]')) { closeVideo(); return; }
      if (e.target.classList.contains('vmodal')) { closeVideo(); return; }
      const s = e.target.closest('[data-scroll]'); if (s) { const t = document.getElementById(s.dataset.scroll); if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
      const t = e.target.closest('[data-t]'); if (t) { toolClick(t); return; }
      const lnk = e.target.closest('a[href^="#"]');
      if (lnk && lnk.getAttribute('href') === (location.hash || '#inicio')) { e.preventDefault(); route(); return; }
      if (e.target.closest('#nav a')) closeMenu();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeVideo(); closeMenu(); } });
    window.addEventListener('hashchange', route);
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    route();
  }
  init();
})();

</script>
</html>
